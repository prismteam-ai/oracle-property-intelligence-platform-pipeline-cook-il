services:
  web:
    build: { context: ., args: { GIT_COMMIT: "${GIT_COMMIT:-unknown}" } }
    image: oracle-cook-il:local
    command: ["node", "apps/web/dist/server/apps/web/src/main.js"]
    ports: ["8080:8080"]
    env_file: .env
    environment: { DATA_DIR: /app/data, PORT: "8080" }
    # bind mount: on the VM `chown -R 1000:1000 ./data` once (the image runs as user `node`, uid 1000)
    volumes: ["./data:/app/data"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  pipeline:
    image: oracle-cook-il:local
    depends_on: [web]
    # Lock contract for data/cook_il.duckdb: DuckDB allows one read-write opener and no other
    # opener across processes. The web opens the file READ_ONLY per query and closes it right
    # after (apps/web/src/db/duck.ts); the pipeline opens read-write and retries on the lock
    # error every 5 s for up to 10 min (apps/pipeline/src/db.ts) before failing the run.
    # Incremental run every 6h; first run happens at start. The cli logs "run started" /
    # "run finished" (run_id, counts, deltas) as JSON; the loop adds wall-clock and exit code.
    # Each run ends by pruning data/dataset/<run_id> snapshots (keeps published runs + newest 2)
    # and old raw inc-* batches (newest 3 per source); see docs/pipeline.md "Retention".
    # Standalone: node apps/pipeline/dist/cli.js prune --keep 2 [--dry-run]
    command:
      - sh
      - -c
      - >-
        while true; do
        echo "pipeline loop: run --incremental start $(date -u +%FT%TZ)";
        node apps/pipeline/dist/cli.js run --incremental;
        echo "pipeline loop: run --incremental end $(date -u +%FT%TZ) exit=$?";
        sleep 21600; done
    env_file: .env
    environment: { DATA_DIR: /app/data, PUBLICATIONS_DIR: /app/data/publications }
    volumes: ["./data:/app/data"]
    restart: unless-stopped
  publisher:
    image: oracle-cook-il:local
    depends_on: [web]
    # Publication is independent of ingestion (cf. per-source ingest -> build -> publish jobs): every
    # hour it publishes the newest completed run if any run since the last publication changed data.
    # It needs the DuckDB write lock only for two short updates, never during uploads/verification.
    # A publication needs >= 2 successful pins (Filebase + Pinata) and >= 2 fully verified gateways;
    # otherwise it stays staged under data/publications/<run_id>/pending and the web keeps serving
    # the previous one. The web activates a new publication within a minute, without a restart.
    command:
      - sh
      - -c
      - >-
        while true;
        do node apps/pipeline/dist/cli.js publish-latest || echo "publisher: publish-latest failed exit=$?";
        sleep 3600; done
    env_file: .env
    environment: { DATA_DIR: /app/data, PUBLICATIONS_DIR: /app/data/publications }
    volumes: ["./data:/app/data"]
    restart: unless-stopped
