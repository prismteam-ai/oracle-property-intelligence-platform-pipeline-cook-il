services:
  web:
    build: { context: ., args: { GIT_COMMIT: "${GIT_COMMIT:-unknown}" } }
    image: oracle-cook-il:local
    command: ["node", "apps/web/dist/server/apps/web/src/main.js"]
    ports: ["8080:8080"]
    env_file: .env
    environment: { DATA_DIR: /app/data, PORT: "8080" }
    # bind mount: on the VM `chown -R 1000:1000 ./data` once (the image runs as user `node`, uid 1000)
    volumes: ["./data:/app/data"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  pipeline:
    image: oracle-cook-il:local
    depends_on: [web]
    # incremental run every 6h; first run happens at start
    command:
      - sh
      - -c
      - "while true; do node apps/pipeline/dist/cli.js run --incremental; sleep 21600; done"
    env_file: .env
    environment: { DATA_DIR: /app/data }
    volumes: ["./data:/app/data"]
    restart: unless-stopped
