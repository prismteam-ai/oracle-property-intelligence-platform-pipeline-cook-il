name: verify-ipfs

# Re-fetch every published object from independent public gateways from a GitHub-hosted runner
# (a datacenter IP, unlike the pipeline host) and commit the result next to the manifest.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id under publications/ (default: latest)"
        required: false
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@cook/pipeline..." build
      - name: Verify from gateways
        run: node apps/pipeline/dist/cli.js verify --run "${{ inputs.run_id }}" --verifier github-actions
      - name: Commit verification record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications/
          git stash --include-untracked -q || true
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git stash pop -q || true
          git add publications/
          git diff --cached --quiet || git commit -m "chore(publications): gateway verification from GitHub Actions"
          git push
