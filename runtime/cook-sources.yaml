permits:
  expected_jurisdiction_count: 3
  assumes_unified_countywide_history: false
  jurisdictions:
    - jurisdiction: City of Chicago
      status: supported
      vendor: socrata-open-data
      portal_kind: historical-export
      portal: https://data.cityofchicago.org/d/ydr8-5enu
      historical_records: true
      source_system: chicago_permits
    - jurisdiction: Unincorporated Cook County (Building & Zoning)
      status: delegated
      vendor: assessor-permit-feed
      portal_kind: historical-export
      portal: https://datacatalog.cookcountyil.gov/d/6yjf-dfxs
      historical_records: true
      source_system: cook_assessor_permits
      note: county permit portal not bulk-exportable; assessor copy of permits used
    - jurisdiction: Suburban municipalities (approx. 130, grouped)
      status: delegated
      vendor: mixed (Accela, Tyler, BS&A, CityView, paper)
      portal_kind: historical-export
      portal: https://datacatalog.cookcountyil.gov/d/6yjf-dfxs
      historical_records: true
      source_system: cook_assessor_permits
      note: municipal portals NOT enumerated individually in this pass (grouped row keeps the validator permit gate green; a per-municipality catalog would be needs-review); assessor copy of permits used countywide (no contractor license, no close date)

destination:
