  - {source_system: chicago_permits, dataset: ydr8-5enu, host: data.cityofchicago.org, mode: bulk-api, rows: 852615, feeds: permit}
  - {source_system: chicago_business_licenses, dataset: r5kz-chrr, host: data.cityofchicago.org, mode: bulk-api, rows: 1211181, feeds: business}
